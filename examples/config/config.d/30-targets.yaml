# Where builds may be deployed. dymploy.yaml only names a target (deploy.target: production); everything
# about it is decided here. The key and known_hosts are files on this machine, never part of this YAML.
targets:
  production:
    host: 10.0.0.20
    user: deploy-shop            # one user per app keeps apps apart
    key_file: /etc/dymploy/targets/production-shop.key        # no passphrase, mode 0600
    known_hosts: /etc/dymploy/targets/production.known_hosts     # the host key must be listed: no trust on first use
    upload_dir: dymploy-uploads     # relative to the login directory (default)
    # secrets:                      # optional: where the secrets of definitions with `deploy.secrets: true` come from
    #   command: [/usr/local/bin/mytool, secrets, get, --app, shop, --format, dotenv]
    #   env_file: /etc/dymploy/mytool.env    # NAME=value lines for the command's environment, mode 0600
    allow:                          # who may deploy here: the same rule as `policy`
      - provider: github
        owner: globex
        repositories: [shop]
        branches: [main]
