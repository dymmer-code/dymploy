# A job that only checks the code: it builds and runs the tests, packs nothing and deploys nowhere.
# The job succeeds or fails with the tests (the exit code of the first step that fails).
version: 1

build:
  image: {from: "hexpm/elixir:1.20.4-erlang-28.5.0.7-debian-trixie-20261005-slim"}
  env: {MIX_ENV: test}
  cache:
    - {name: deps, path: /tmp/deps}
  limits: {cpus: 2, memory: 2g, timeout: 15m}
  steps:
    - name: dependencies
      run: mix local.hex --force && mix local.rebar --force && mix deps.get
    - name: tests
      run: mix test
