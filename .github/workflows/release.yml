name: release

# A tag vX.Y.Z builds the binaries and publishes them, with their checksums, as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="dymploy_${TAG}_${os}_${arch}"
            mkdir "dist/$name"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/dymploy" .
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
